name: iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Tauri iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Build Rust for iOS Simulator
        run: |
          cd src-tauri
          cargo build \
            --target aarch64-apple-ios-sim \
            --release

      - name: Find iOS project
        run: |
          find src-tauri/gen/apple \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Build iOS Simulator with Xcode
        run: |
          xcodebuild \
            -project src-tauri/gen/apple/app.xcodeproj \
            -scheme app_iOS \
            -sdk iphonesimulator \
            -configuration release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find generated app
        run: |
          echo "=== Generated apps ==="
          find src-tauri/gen/apple \
            -type d \
            -name "*.app" \
            -print || true

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: enigma-ios-simulator
          path: |
            src-tauri/gen/apple/**/*.app
          if-no-files-found: warn
