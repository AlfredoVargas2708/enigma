<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos Enigma - Fase de Grupos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./image.png">
</head>

<body>
    <header class="app-header">
        <div class="brand">
            <div class="brand-badge">
                <img src="./image.png" alt="">
            </div>
            <div class="brand-text">
                <h1>PARTIDOS <span class="accent">ENIGMA</span></h1>
                <p class="subtitle">Fase de grupos</p>
            </div>
        </div>
        <nav class="tabs">
            <button class="tab-btn view-tab active" data-view="calendar">Calendario</button>
            <button class="tab-btn view-tab" data-view="pairs">Resultados por pareja</button>
            <button class="tab-btn view-tab" data-view="stats">Resumen de estadísticas</button>
        </nav>
    </header>

    <main>
        <div class="legend">
            <div class="legend-title">ABREVIACIONES DE ESTADÍSTICAS</div>
            <div class="legend-items" id="stats-legend-items"></div>
        </div>
        <section id="calendar-view" class="view">
            <div class="day-columns">
                <div class="day-panel">
                    <div class="day-panel-header"><span class="cal-icon">📅</span> VIERNES</div>
                    <div class="matches-container" data-day="Viernes"></div>
                </div>
                <div class="day-panel">
                    <div class="day-panel-header"><span class="cal-icon">📅</span> SÁBADO</div>
                    <div class="matches-container" data-day="Sábado"></div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-title">CATEGORÍAS</div>
                <div class="legend-items" id="legend-items"></div>
            </div>
        </section>

        <section id="stats-view" class="view hidden">
            <h2>Estadísticas acumuladas por jugador</h2>
            <div id="stats-summary" class="stats-summary"></div>
        </section>

        <section id="pairs-view" class="view hidden">
            <h2>Resultados por pareja</h2>
            <div id="pairs-summary" class="pairs-summary"></div>
        </section>
    </main>

    <footer class="app-footer">
        <p class="footer-tagline">COMPETIMOS, NOS DIVERTIMOS, CRECEMOS.<br><strong>¡VAMOS EQUIPO!</strong></p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
